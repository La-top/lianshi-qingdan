<main><div class='wrap'>
<h1 style='margin-top:4px'>基础代谢计算器 🔥</h1>
<p class='muted'>基础代谢 = 身体躺着不动,一天也要消耗的热量。算清楚它,安排饮食才有底。</p>
<div class='card'>
<div class='row' style='margin-bottom:10px'><b>性别</b></div><div class='row' id='sexGroup' style='gap:8px;margin-bottom:16px'>
<button type='button' class='goal-chip' data-sex='male'><span class='g-ico'>👨</span>男</button><button type='button' class='goal-chip' data-sex='female'><span class='g-ico'>👩</span>女</button></div>
<div class='grid grid-2' style='row-gap:14px'>
<div><label class='small muted'>年龄(岁)</label><input type='number' id='age' min='10' max='100' placeholder='例如 25' style='width:100%;margin-top:4px'></div>
<div><label class='small muted'>身高(厘米)</label><input type='number' id='height' min='120' max='230' placeholder='例如 175' style='width:100%;margin-top:4px'></div>
<div><label class='small muted'>体重(公斤)</label><input type='number' id='weight' min='30' max='250' placeholder='例如 70' style='width:100%;margin-top:4px'></div>
<div><label class='small muted'>训练年限(年)</label><input type='number' id='years' min='0' max='50' value='0' placeholder='刚开始填 0' style='width:100%;margin-top:4px'></div>
</div>
<p class='small muted' style='margin-top:8px'>训练年限不直接改公式,但它关系到肌肉量(见下方结果说明)。</p>
<div class='row' style='margin-top:14px'><button class='btn btn-primary' id='calcBtn'>🧮 计算基础代谢</button></div>
</div>
<div id='result' style='display:none;margin-top:16px'></div>
</div></main>
