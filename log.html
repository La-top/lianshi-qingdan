<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>今日记录 · 练食清单</title>
<link rel='icon' href='data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%F0%9F%A5%97%3C%2Ftext%3E%3C%2Fsvg%3E'>
<link rel='stylesheet' href='assets/css/style.css'>
</head>
<body data-page='log'>
<header class='topbar'><div class='wrap bar'><a class='brand' href='index.html'><span class='logo'>🥗</span>练食清单</a><nav class='nav'><a data-page='home' href='index.html'>首页</a><a data-page='foods' href='foods.html'>食物库</a><a data-page='select' href='select.html'>选食物</a><a data-page='log' href='log.html'>今日记录</a><a data-page='saved' href='saved.html'>收藏</a><a data-page='coach' href='coach.html'>AI营养师</a><a data-page='plan' href='plan.html'>餐单</a><a data-page='bmr' href='bmr.html'>测代谢</a><a data-page='about' href='about.html'>关于</a></nav></div></header>
<main><div class='wrap'>
<h1 style='margin-top:4px'>饮食记录 📝</h1>
<p class='muted'>记录存在<b>这台电脑的浏览器里</b>,定期点底部「导出备份」更保险</p>
<div class='card'><div class='row' style='justify-content:space-between;flex-wrap:wrap;gap:10px'>
<div class='row' style='gap:6px'><button class='btn btn-ghost btn-sm' id='prevDay'>← 前一天</button><button class='btn btn-ghost btn-sm' id='nextDay'>后一天 →</button><button class='btn btn-soft btn-sm' id='goToday'>今天</button></div>
<input type='date' id='dateInput' style='font-size:14px'>
</div></div>
<div class='card' id='summary'></div>
<div class='card' style='text-align:center'><button class='btn btn-primary btn-block' id='addBtn'>＋ 添加食物/饮品</button></div>
<div id='meals' style='margin-top:4px'></div>
<div class='card'><h3>数据管理</h3>
<div class='row' style='gap:8px'>
<button class='btn btn-ghost btn-sm' id='exportBtn'>💾 导出备份</button>
<button class='btn btn-ghost btn-sm' id='importBtn'>📂 导入备份</button>
<button class='btn btn-danger btn-sm' id='clearDay'>🗑 清空当天</button>
</div>
<p class='small muted' style='margin-top:8px'>导出会下载一个 JSON 文件;换电脑或清缓存前,先导出保存。导入会<b>覆盖</b>当前所有记录。</p>
</div>
<input type='file' id='importFile' accept='.json,application/json' style='display:none'>
</div></main>
<footer class='footer'><div class='wrap'>练食清单 · 给自己看的健身食物小站 · <a href='about.html'>数据说明与免责声明</a></div></footer>
<script src='data/foods.js'></script>
<script src='assets/js/common.js'></script>
<script src='assets/js/page-log.js'></script>
</body>
</html>
